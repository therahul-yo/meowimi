<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14121c">
  <title>Meowimi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/marked/marked.umd.js" defer></script>
  <script src="/vendor/dompurify/purify.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <button class="brand" id="home" type="button" aria-label="Meowimi home"><svg class="brand-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 17 8 6l9 5a20 20 0 0 1 6 0l9-5 1 11c2 3 2 7 0 10-2 5-7 8-13 8S9 32 7 27c-2-3-2-7 0-10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 22h.01M26 22h.01M18 27c1.3 1.3 2.7 1.3 4 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>meowimi</span></button>
      <span class="header-note"><span class="status-dot"></span>Your curious companion</span>
    </header>
    <main>
      <section id="welcome" class="welcome">
        <div class="cat-portrait" aria-hidden="true"><svg viewBox="0 0 160 150" fill="none"><path class="orbit" d="M17 76c0-34 28-61 63-61s63 27 63 61-28 61-63 61S17 110 17 76Z"/><path class="cat-shape" d="M42 66 44 30l27 16a55 55 0 0 1 18 0l27-16 2 36c6 9 7 20 3 29-6 15-22 24-41 24s-35-9-41-24c-4-9-3-20 3-29Z"/><path class="cat-detail" d="m50 46 11 7m49-7-11 7M60 76h.1m39.8 0h.1M76 88l4 3 4-3m-4 3c-2 5-6 6-9 4m9-4c2 5 6 6 9 4M33 83l18 3m-19 6 19-1m76-8-18 3m19 6-19-1"/></svg></div>
        <p class="welcome-kicker">Thoughtful answers, curious by nature.</p>
        <h1>What’s on your mind?</h1>
        <p class="welcome-copy">Ask anything, revisit an idea, or see what’s changed. Meowimi keeps the conversation going and searches when it needs to.</p>
        <button id="resume" class="resume" type="button" hidden>Return to conversation</button>
        <div class="examples" aria-label="Example questions"><button type="button">What can you help me research?</button><button type="button">How do you check what’s changed?</button></div>
      </section>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="status" class="status" role="status"></div>
    </main>
    <footer>
      <form id="form"><label class="sr-only" for="prompt">Your message</label><textarea id="prompt" rows="1" placeholder="Ask Meowimi anything…" maxlength="12000" required></textarea><button id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
      <div class="footer-note"><span>Web search when it matters</span><span>Meowimi can make mistakes. Check sources.</span></div>
    </footer>
  </div>
</body>
</html>
