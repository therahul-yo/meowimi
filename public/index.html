<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search Chat</title><link rel="stylesheet" href="/style.css"><script src="/vendor/marked/marked.umd.js" defer></script><script src="/vendor/dompurify/purify.min.js" defer></script><script src="/app.js" defer></script></head><body><div class="shell"><header><div class="brand"><span class="mark" aria-hidden="true">✳</span><span>Search Chat</span></div><span class="header-note">A conversation with context</span></header><main><section id="welcome" class="welcome"><p class="eyebrow">A little help, with the details.</p><h1>Pick up where<br><em>you left off.</em></h1><p>Ask a question, revisit an answer, or find out what’s changed. Your conversation stays here between visits.</p><div class="examples"><button type="button">What can you help me research?</button><button type="button">How do you check what’s changed?</button></div></section><div id="messages" class="messages" aria-live="polite"></div><div id="status" class="status" role="status"></div></main><footer><form id="form"><label class="sr-only" for="prompt">Your message</label><textarea id="prompt" rows="1" placeholder="Ask anything…" maxlength="12000" required></textarea><button id="send" type="submit" aria-label="Send message">↑</button></form><div class="footer-note"><span>Searches the web when needed</span><span>Answers can be wrong. Check sources.</span></div></footer></div></body></html>
